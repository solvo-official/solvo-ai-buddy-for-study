<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="70%" stop-color="#070c18" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Holographic Ring Glow -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.9" />
    </linearGradient>

    <!-- 3D Ribbon S Gradient -->
    <linearGradient id="sRibbon" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#bae6fd" />
      <stop offset="70%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Inner S Shadow Gradient -->
    <linearGradient id="sInner" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Gold Tassel / Book Accent -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Dark Tech Base -->
  <circle cx="64" cy="64" r="62" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Outer Holographic Halo Rings -->
  <circle cx="64" cy="64" r="54" fill="none" stroke="url(#ringGrad)" stroke-width="1.8" stroke-dasharray="8 4 16 4" opacity="0.85" filter="url(#glow)" />
  <circle cx="64" cy="64" r="48" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4" />

  <!-- Orbiting Sparkles & Particles -->
  <circle cx="28" cy="38" r="1.5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="102" cy="74" r="1.5" fill="#c084fc" filter="url(#glow)" />
  <circle cx="36" cy="94" r="1.2" fill="#67e8f9" />
  <circle cx="94" cy="32" r="1.2" fill="#e0e7ff" />

  <!-- Pedestal Base Under S -->
  <ellipse cx="64" cy="100" rx="30" ry="7" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />
  <ellipse cx="64" cy="100" rx="20" ry="4" fill="#0284c7" fill-opacity="0.2" />

  <!-- Phone / Scanner Icon on Upper Right -->
  <g transform="translate(86, 32) rotate(12)" filter="url(#glow)">
    <rect x="0" y="0" width="16" height="26" rx="3" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.2" fill-opacity="0.8" />
    <line x1="4" y1="4" x2="12" y2="4" stroke="#7dd3fc" stroke-width="1" stroke-linecap="round" />
    <circle cx="8" cy="21" r="1" fill="#7dd3fc" />
    <!-- Scanner Beam Waves -->
    <path d="M-2 8 Q-8 12 -14 14 M-1 14 Q-7 17 -16 18 M-2 20 Q-7 21 -14 22" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.8" stroke-dasharray="2 2" />
    <!-- Little Stars -->
    <polygon points="8,9 9,11 11,12 9,13 8,15 7,13 5,12 7,11" fill="#bae6fd" />
  </g>

  <!-- Stylized 3D Ribbon Questrix Monogram -->
  <!-- Back / Lower Loop Shadow -->
  <path
    d="M62 58 C50 58 40 66 40 78 C40 92 52 98 66 98 C78 98 86 91 86 82 C86 72 76 66 64 62"
    fill="none"
    stroke="url(#sInner)"
    stroke-width="10"
    stroke-linecap="round"
    opacity="0.9"
  />

  <!-- Front / Upper Loop and Main Ribbon -->
  <path
    d="M74 38 C60 38 48 44 48 54 C48 64 58 68 70 72 C82 76 88 84 88 90 C88 96 80 100 66 100 C52 100 44 94 42 86"
    fill="none"
    stroke="url(#sRibbon)"
    stroke-width="9"
    stroke-linecap="round"
    filter="url(#glow)"
  />

  <!-- Top Spine of the S -->
  <path
    d="M52 38 C56 34 64 32 72 34 C80 36 84 42 84 48 C84 54 78 58 68 62"
    fill="none"
    stroke="#ffffff"
    stroke-width="3"
    stroke-linecap="round"
    opacity="0.9"
  />

  <!-- Open Book in Center of S Loop -->
  <g transform="translate(64, 76)" filter="url(#glow)">
    <!-- Left Page -->
    <path d="M-9 3 Q-5 0 0 1 L0 8 Q-5 7 -9 10 Z" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8" />
    <!-- Right Page -->
    <path d="M9 3 Q5 0 0 1 L0 8 Q5 7 9 10 Z" fill="#bae6fd" stroke="#0284c7" stroke-width="0.8" />
    <!-- Book Spine -->
    <line x1="0" y1="1" x2="0" y2="8" stroke="#0369a1" stroke-width="1" />
  </g>

  <!-- 3D Graduation Cap on Top of S -->
  <g transform="translate(64, 25)" filter="url(#glow)">
    <!-- Cap Diamond (Mortarboard Top) -->
    <polygon points="0,-10 18,-3 0,4 -18,-3" fill="#0284c7" stroke="#38bdf8" stroke-width="1.2" />
    <polygon points="0,-8 15,-3 0,3 -15,-3" fill="url(#sRibbon)" opacity="0.6" />
    <!-- Cap Skull Base -->
    <path d="M-8 0 L-8 5 Q0 9 8 5 L8 0 Q0 3 -8 0 Z" fill="#0369a1" stroke="#38bdf8" stroke-width="0.8" />
    <!-- Button on Top -->
    <circle cx="0" cy="-3" r="1.5" fill="#f59e0b" />
    <!-- Tassel Hanging Down to the Right -->
    <path d="M0 -3 Q9 -1 11 8 Q12 14 13 18" fill="none" stroke="url(#goldAccent)" stroke-width="1.2" stroke-linecap="round" />
    <circle cx="13" cy="19" r="1.4" fill="#f59e0b" />
  </g>

  <!-- Magical Glow Accent Dot -->
  <circle cx="64" cy="22" r="1.5" fill="#ffffff" filter="url(#glow)" />
</svg>