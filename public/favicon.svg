<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="qBgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="65%" stop-color="#070c18" />
      <stop offset="100%" stop-color="#020610" />
    </radialGradient>

    <!-- Cyan Neon Glow Filter -->
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Soft Ambient Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Neon Cyan Gradient -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Core Aperture Blade Gradient -->
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Bright Edge Highlight -->
    <linearGradient id="edgeHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Squircle Rounded App Icon Base -->
  <rect x="4" y="4" width="120" height="120" rx="28" ry="28" fill="url(#qBgGrad)" stroke="rgba(56, 189, 248, 0.45)" stroke-width="1.8" />

  <!-- Outer Concentric Orbit Track -->
  <circle cx="62" cy="58" r="48" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.2" stroke-dasharray="6 4 12 4" />
  
  <!-- Outer Segmented Tech Ring -->
  <circle cx="62" cy="58" r="42" fill="none" stroke="url(#neonCyan)" stroke-width="3" stroke-linecap="round" stroke-dasharray="50 18 35 15" filter="url(#softGlow)" />

  <!-- Circuit Trace Nodes -->
  <circle cx="62" cy="16" r="2.5" fill="#38bdf8" filter="url(#cyanGlow)" />
  <circle cx="20" cy="58" r="2.5" fill="#38bdf8" filter="url(#cyanGlow)" />
  <circle cx="100" cy="40" r="2" fill="#00f0ff" />
  <line x1="62" y1="16" x2="62" y2="24" stroke="#38bdf8" stroke-width="1.5" />
  <line x1="20" y1="58" x2="28" y2="58" stroke="#38bdf8" stroke-width="1.5" />

  <!-- Main Circular Ring of 'Q' -->
  <circle cx="62" cy="58" r="32" fill="url(#bladeGrad)" stroke="url(#neonCyan)" stroke-width="4.5" filter="url(#cyanGlow)" />

  <!-- Central Camera Aperture Blades (Forming the Iris) -->
  <g transform="translate(62, 58)" filter="url(#softGlow)">
    <!-- 8 Aperture Iris Blades -->
    <path d="M0 -22 C8 -14, 14 -8, 18 0 L0 0 Z" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
    <path d="M16 -16 C18 -6, 16 2, 12 12 L0 0 Z" fill="#0369a1" stroke="#00f0ff" stroke-width="1" opacity="0.9" />
    <path d="M22 0 C14 8, 8 14, 0 18 L0 0 Z" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
    <path d="M16 16 C6 18, -2 16, -12 12 L0 0 Z" fill="#0369a1" stroke="#00f0ff" stroke-width="1" opacity="0.9" />
    <path d="M0 22 C-8 14, -14 8, -18 0 L0 0 Z" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
    <path d="M-16 16 C-18 6, -16 -2, -12 -12 L0 0 Z" fill="#0369a1" stroke="#00f0ff" stroke-width="1" opacity="0.9" />
    <path d="M-22 0 C-14 -8, -8 -14, 0 -18 L0 0 Z" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
    <path d="M-16 -16 C-6 -18, 2 -16, 12 -12 L0 0 Z" fill="#0369a1" stroke="#00f0ff" stroke-width="1" opacity="0.9" />

    <!-- Central Photon Glow Core -->
    <circle cx="0" cy="0" r="7" fill="#ffffff" filter="url(#cyanGlow)" />
    <circle cx="0" cy="0" r="4" fill="#bae6fd" />
  </g>

  <!-- Futuristic 'Q' Aperture Diagonal Tail -->
  <g filter="url(#cyanGlow)">
    <!-- Outer Tail Track -->
    <path d="M80 76 L102 98" stroke="url(#neonCyan)" stroke-width="7" stroke-linecap="round" />
    <!-- Core Bright White Beam inside Tail -->
    <path d="M81 77 L100 96" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <!-- Terminal Circuit Accent Dot -->
    <circle cx="102" cy="98" r="4.5" fill="#00f0ff" />
    <circle cx="102" cy="98" r="2" fill="#ffffff" />
  </g>

  <!-- Subtle Inner Ring Highlight -->
  <circle cx="62" cy="58" r="23" fill="none" stroke="url(#edgeHighlight)" stroke-width="1.2" opacity="0.75" />
</svg>